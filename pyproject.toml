[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contactsync-professional"
version = "3.5.0"
description = "Modulare Kontakt-Synchronisationsplattform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0"
]
scripts = { contactsync-professional = "contactsync.main:run", contactsync-automation = "contactsync.automation_service:main", contactsync-procurement = "contactsync.procurement:main" }

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["contactsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
