schema: itpz/v1
id: contactsync-professional
name: ContactSync Professional
version: 3.4.0
type: deb
channel: stable
description: Modulare Kontakt- und Verzeichniszentrale mit Plugin-Framework für externe Systeme.
category: Kommunikation
homepage: https://github.com/Markus4771/contactsync
package:
  name: contactsync-professional
  asset: contactsync-professional_3.4.0_all.deb
  sha256_asset: contactsync-professional_3.4.0_all.deb.sha256
source:
  provider: github
  repository: Markus4771/contactsync
install:
  service: contactsync-professional.service
  package_manager: apt
  rollback: previous-package
health:
  url: http://127.0.0.1:8000/health
  timeout_seconds: 60
dependencies: []
permissions:
  - network
  - filesystem-read
  - filesystem-write
  - database-read
  - database-write
  - systemd
metadata:
  maintainer: Markus4771
  port: 8000
  architecture: core-plus-connector-plugins
  automation_role: master-data-hub
  plugin_api: contactsync.plugins
