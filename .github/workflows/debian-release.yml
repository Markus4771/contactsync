name: Debian-Paket

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Python-Code prüfen
        run: python3 -m compileall -q contactsync
      - name: Debian-Paket bauen
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
      - name: Paket prüfen
        run: |
          VERSION="$(cat version.txt)"
          test -f "dist/contactsync-professional_${VERSION}_all.deb"
          test -f "dist/contactsync-professional_${VERSION}_all.deb.sha256"
          dpkg-deb --info "dist/contactsync-professional_${VERSION}_all.deb"
          sha256sum -c "dist/contactsync-professional_${VERSION}_all.deb.sha256"
          dpkg-deb --contents "dist/contactsync-professional_${VERSION}_all.deb" | grep -q 'contactsync-automation.service'
          dpkg-deb --contents "dist/contactsync-professional_${VERSION}_all.deb" | grep -q 'contactsync/procurement.py'
      - uses: actions/upload-artifact@v4
        with:
          name: contactsync-debian-${{ steps.version.outputs.version }}
          path: |
            dist/*.deb
            dist/*.sha256
      - name: Release-Tag prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(cat version.txt)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ContactSync Professional ${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.sha256
